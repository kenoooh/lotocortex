name: Sincronizar Lotofácil

on:
  workflow_dispatch:

  schedule:
    # O GitHub usa UTC.
    # 21h10–22h no Brasil corresponde a 00h10–01h UTC.
    # A lista de dias também considera essa conversão.
    - cron: "*/5 0-1 * * 0,2-6"

jobs:
  sincronizar-lotofacil:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependência
        run: python -m pip install --quiet requests

      - name: Consultar CAIXA e atualizar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_lotofacil.py
